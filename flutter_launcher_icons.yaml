flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/app_icon_round.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#0B0F19"
    theme_color: "#10B981"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  linux:
    generate: true
    image_path: "assets/app_icon.png"
