name: kappogy_share
description: "Ultra-fast, secure, end-to-end encrypted cross-platform local file sharing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  json_annotation: ^4.9.0
  logger: ^2.4.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.1
  file_picker: ^12.0.0
  permission_handler: ^13.0.1
  desktop_drop: ^0.8.0
  mime_type: ^1.0.1
  open_filex: ^4.7.0
  path: ^1.9.1
  cryptography: ^2.9.0
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  uuid: ^4.6.0
  nsd: ^5.0.1
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  connectivity_plus: ^7.3.1
  archive: ^4.2.0
  flutter_p2p_connection: ^1.0.3
  receive_sharing_intent: ^1.9.0
  fl_chart: ^1.2.0
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  dynamic_color: ^1.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.9.5
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
